<!DOCTYPE html>
<!-- Declara que este documento es HTML5 (la versión actual). Siempre en la 1ª línea. -->

<html lang="es">
<!-- Elemento raíz. lang="es" indica que el contenido está en español
     (ayuda a buscadores y a lectores de pantalla). -->

<head>
<!-- La "cabeza": información sobre la página que NO se ve directamente
     (título, codificación, enlaces a estilos y fuentes). -->

  <meta charset="UTF-8">
  <!-- Codificación de caracteres. UTF-8 permite tildes, ñ, etc. sin que salgan símbolos raros. -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hace que la página se adapte al ancho del móvil (diseño responsive).
       Sin esto, en el móvil se vería diminuta. -->

  <title>Drone-SAR · Control</title>
  <!-- El texto que aparece en la pestaña del navegador. -->

  <!-- ===== PWA: manifest + iconos + color de tema =====
       El manifest.json describe la "app" (nombre, iconos, modo standalone).
       Es lo que hace aparecer el botón/opción "Instalar" en el navegador. -->
  <link rel="manifest" href="manifest.json">

  <!-- Icono que usan Android/Chrome al instalar (y como favicon en pestaña). -->
  <link rel="icon" href="icons/favicon.png" type="image/png">

  <!-- iOS no lee el manifest.json para el icono de pantalla de inicio:
       necesita este link aparte, con imagen SIN transparencia. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Color de la barra de estado/navegador cuando la app está instalada
       (mismo tono que el fondo de la página, para que no "salte"). -->
  <meta name="theme-color" content="#0D0C0A">

  <!-- Le dice a iOS que esta página se puede abrir como app a pantalla
       completa (sin la barra de Safari) al añadirla al inicio. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drone-SAR">

  <!-- Precarga de las fuentes de Google (mejora un poco la velocidad de descarga). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Descarga las dos tipografías que usa la página: una condensada de
       rótulo industrial (títulos y botones) y una monoespaciada técnica
       (etiquetas, datos, registro). -->
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Condensed:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- AQUÍ está la clave de la separación: en vez de un bloque <style> con todo
       el CSS dentro, enlazamos un fichero externo 'estilos.css'.
       El navegador lo descarga y aplica los estilos desde ahí.
       'estilos.css' debe estar en la MISMA carpeta que este control.html. -->
  <link rel="stylesheet" href="estilos.css">

</head>

<body>
<!-- El "cuerpo": todo lo que SÍ se ve en la página. -->

  <!-- Contenedor central. La clase "wrap" se define en el CSS para centrar
       el contenido y limitar su ancho. -->
  <div class="wrap">

    <!-- Encabezado de la página -->
    <div class="eyebrow">TFG · Drone-SAR</div>   <!-- pequeño texto superior en naranja -->
    <h1>Control <span class="sar">·</span> dron</h1>  <!-- título; el <span> colorea el punto -->
    <div class="sub">Panel de teleoperación (simulación)</div>  <!-- subtítulo -->
    <div class="hazard" aria-hidden="true"></div>  <!-- franja decorativa tipo cinta de baliza -->

    <!-- ============ GRUPO: VÍDEO EN DIRECTO ============ -->
    <!-- Transmisión en directo de la cámara del dron (procesada por el
         nodo edge). El iframe apunta a otro subdominio (stream.gorostiditfg.com);
         .video-wrap en estilos.css lo hace responsive (ver comentario allí). -->
    <div class="grupo">
      <h2>Vídeo en directo (Edge AI)</h2>
      <div class="video-wrap">
        <iframe src="https://stream.gorostiditfg.com/dron_live"
                title="Transmisión en directo del dron"
                allow="autoplay; fullscreen"
                allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- ============ GRUPO: DRON ============ -->
    <!-- Desplegable para elegir a qué dron van dirigidos los comandos.
         Su valor se lee en cada envío y se manda como "drone_id". -->
    <div class="grupo">
      <h2>Dron</h2>
      <div class="fila">
        <select id="droneId" aria-label="Dron seleccionado">
          <option value="dron-01">dron-01</option>
          <option value="dron-02">dron-02</option>
        </select>
      </div>
    </div>

    <!-- ============ GRUPO: MOTORES ============ -->
    <!-- Cada "grupo" es una sección de botones con su título. -->
    <div class="grupo">
      <h2>Motores</h2>
      <div class="fila">
        <!-- onclick="enviar('arm')" -> al pulsar, llama a la función JavaScript
             'enviar' (definida abajo) con el comando 'arm'. -->
        <button class="b-ok" onclick="enviar('arm')">Armar</button>
        <button class="b-danger" onclick="enviar('disarm')">Desarmar</button>
      </div>
    </div>

    <!-- ============ GRUPO: DESPEGUE ============ -->
    <div class="grupo">
      <h2>Despegue</h2>
      <div class="takeoff">
        <!-- Campo numérico para escribir la altitud. id="alt" permite que
             el JavaScript lea su valor. value="20" es el valor inicial. -->
        <input id="alt" type="number" value="20" min="1" max="120" aria-label="Altitud en metros">
        <!-- Este botón llama a 'despegar()', que lee la altitud y la envía. -->
        <button class="b-ok" style="flex:1" onclick="despegar()">Despegar (m)</button>
      </div>
    </div>

    <!-- ============ GRUPO: NAVEGACIÓN ============ -->
    <div class="grupo">
      <h2>Navegación</h2>
      <div class="fila">
        <button class="b-neutral" onclick="enviar('start_mission')">Iniciar misión</button>
        <button class="b-neutral" onclick="enviar('hold')">Mantener</button>
      </div>
    </div>

    <!-- ============ GRUPO: REGRESO ============ -->
    <div class="grupo">
      <h2>Regreso</h2>
      <div class="fila">
        <button class="b-neutral" onclick="enviar('land')">Aterrizar</button>
        <button class="b-neutral" onclick="enviar('rtl')">Volver a casa (RTL)</button>
      </div>
    </div>

    <!-- ============ GRUPO: CÁMARA ============ -->
    <!-- Empezar/parar la grabación de vídeo con la cámara del dron.
         De momento solo se ENVÍA el comando a la API; falta decidir cómo
         lo atiende el nodo edge (siguiente paso, junto contigo). -->
    <div class="grupo">
      <h2>Cámara</h2>
      <div class="fila">
        <button class="b-ok" onclick="enviar('start_recording')">Empezar grabación</button>
        <button class="b-danger" onclick="enviar('stop_recording')">Parar grabación</button>
      </div>
    </div>

    <!-- ============ GRUPO: SISTEMA (Raspberry Pi) ============ -->
    <!-- Comandos que no controlan el vuelo, sino la propia Raspberry Pi y
         los parámetros de sus servicios (sensor, vídeo). De momento estos
         comandos solo se ENVÍAN a la API; falta que la Pi (otro repo) los
         atienda de verdad. -->
    <div class="grupo">
      <h2>Sistema (Raspberry Pi)</h2>

      <div class="fila">
        <!-- Apaga la Raspberry Pi. Es una acción irreversible desde la web
             (habría que ir físicamente a reiniciarla), así que usamos el
             estilo "b-danger" como en Desarmar. -->
        <button class="b-danger" onclick="apagarPi()">Apagar Raspberry Pi</button>
      </div>

      <!-- Intervalo de envío del sensor: cada cuántos segundos el "modo
           sensor" manda datos. Parametrizable: se escribe un número y se
           envía como dato extra junto al comando. -->
      <div class="takeoff">
        <input id="sensorInterval" type="number" value="60" min="1" step="1" aria-label="Intervalo de envío del sensor en segundos">
        <button class="b-neutral" style="flex:1" onclick="setSensorInterval()">Intervalo sensor (s)</button>
      </div>

      <!-- Throttling de vídeo: cada cuánto tiempo (o a qué límite) se envían
           los fotogramas/streaming de vídeo. También parametrizable. -->
      <div class="takeoff">
        <input id="videoThrottle" type="number" value="500" min="0" step="10" aria-label="Throttling de vídeo en milisegundos">
        <button class="b-neutral" style="flex:1" onclick="setVideoThrottle()">Throttling vídeo (ms)</button>
      </div>
    </div>

    <!-- Registro de comandos: aquí el JavaScript irá escribiendo lo que se envía
         y las respuestas. Empieza con un texto gris de aviso. -->
    <div class="log" id="log"><span class="t">Registro de comandos…</span></div>

  </div>

  <!-- ============ JAVASCRIPT (la lógica de los botones) ============ -->
  <!-- El <script> contiene el código que se ejecuta en el navegador cuando
       pulsas los botones. Es lo que convierte un clic en una petición a la API. -->
  <script>

    // === CONFIGURA AQUÍ la dirección de tu API ===
    // Es la URL base a la que se enviarán los comandos.
    // - En LOCAL o con el puerto abierto: la IP del EC2 + puerto 5000.
    // - Si algún día sirves por HTTPS con reverse proxy: cambia esto a "/api".
    const API_BASE = "https://api.gorostiditfg.com/api";

    // Guardamos una referencia al recuadro del registro para escribir en él.
    const log = document.getElementById('log');

    // Función auxiliar: añade una línea al registro con la hora.
    // 'texto' es lo que se escribe; 'clase' le da color (ok, error, comando).
    function anota(texto, clase){
      const hora = new Date().toLocaleTimeString();   // hora actual (hh:mm:ss)
      const linea = document.createElement('div');     // crea una línea nueva
      linea.innerHTML = `<span class="t">${hora}</span> <span class="${clase}">${texto}</span>`;
      log.prepend(linea);   // la añade ARRIBA del todo (lo más reciente primero)
    }

    // Función principal: envía un comando a la API.
    // 'command' es la acción (arm, disarm...); 'extra' son datos opcionales (p. ej. altitud).
    async function enviar(command, extra){
      // Lee el dron elegido en el desplegable y lo añade al cuerpo,
      // junto con el comando y los datos extra.
      const droneId = document.getElementById('droneId').value;
      const cuerpo = Object.assign({command, drone_id: droneId}, extra || {});
      anota(`→ [${droneId}] ${command}`, 'l-cmd');   // deja constancia en el registro

      try {
        // fetch = hace la petición HTTP a la API (POST al endpoint /command).
        const r = await fetch(`${API_BASE}/command`, {
          method: 'POST',                                  // método POST (enviar datos)
          headers: {'Content-Type': 'application/json'},   // avisamos de que enviamos JSON
          body: JSON.stringify(cuerpo)                     // convertimos el objeto a texto JSON
        });
        const data = await r.json();   // leemos la respuesta de la API (también JSON)

        // Según lo que responda la API, anotamos éxito o error.
        if (data.ok){ anota(`✓ ${command} enviado`, 'l-ok'); }
        else { anota(`✗ ${data.error || 'error'}`, 'l-err'); }

      } catch(e){
        // Si ni siquiera se pudo conectar con la API (apagada, puerto cerrado...).
        anota(`✗ sin conexión con la API`, 'l-err');
      }
    }

    // Función del botón "Despegar": lee la altitud del campo y la envía.
    function despegar(){
      const alt = parseFloat(document.getElementById('alt').value);  // lee el número
      if (isNaN(alt)){ anota('✗ altitud no válida', 'l-err'); return; }  // valida
      enviar('takeoff', {altitude: alt});   // envía takeoff con la altitud como dato extra
    }

    // Botón "Apagar Raspberry Pi": pide confirmación (es irreversible desde
    // la web) y envía el comando 'shutdown'. La Pi aún no lo atiende: eso
    // se conecta en el repo de la Pi más adelante.
    function apagarPi(){
      if (!confirm('¿Seguro que quieres apagar la Raspberry Pi?')) return;
      enviar('shutdown');
    }

    // Botón "Intervalo sensor (s)": lee el intervalo en segundos y lo envía
    // como dato extra junto al comando 'set_sensor_interval'.
    function setSensorInterval(){
      const seg = parseFloat(document.getElementById('sensorInterval').value);
      if (isNaN(seg) || seg <= 0){ anota('✗ intervalo no válido', 'l-err'); return; }
      enviar('set_sensor_interval', {interval_seconds: seg});
    }

    // Botón "Throttling vídeo (ms)": lee el throttling en milisegundos y lo
    // envía como dato extra junto al comando 'set_video_throttle'.
    function setVideoThrottle(){
      const ms = parseFloat(document.getElementById('videoThrottle').value);
      if (isNaN(ms) || ms < 0){ anota('✗ throttling no válido', 'l-err'); return; }
      enviar('set_video_throttle', {throttle_ms: ms});
    }

    // === Registro del Service Worker (PWA) ===
    // Comprueba que el navegador soporte service workers (todos los
    // modernos lo hacen) y, si es así, le pide que registre 'sw.js'.
    // A partir de ahí el propio navegador se encarga de instalarlo,
    // cachear el app shell y mantenerlo actualizado.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => anota('Service worker registrado (modo offline activo)', 'l-ok'))
          .catch(() => anota('No se pudo registrar el service worker', 'l-err'));
      });
    }

  </script>

</body>
</html>
